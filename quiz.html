<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Online Quiz System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
    <div class="quiz-container" id="quizContainer">
        <!-- Header -->
        <header class="quiz-header">
            <div class="quiz-header-content">
                <h1 class="quiz-title">Online Quiz System</h1>
                <div class="header-actions">
                    <div class="timer" id="timer">
                        <span class="timer-label">Time Remaining:</span>
                        <span class="timer-display" id="timerDisplay">10:00</span>
                    </div>
                    <button class="btn btn-secondary" id="backBtn">← Back</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="quiz-main">
            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                    </div>
                    <span class="progress-percentage" id="progressPercentage">0%</span>
                </div>
                <p class="question-number" id="questionNumber">Question 1 of 10</p>
            </div>

            <!-- Question Indicator (Dots) -->
            <div class="question-indicator" id="questionIndicator"></div>

            <!-- Question Content -->
            <div class="question-section">
                <h2 class="question-text" id="questionText">Loading question...</h2>

                <!-- Options -->
                <div class="options-container" id="optionsContainer">
                    <!-- Options will be dynamically inserted here -->
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="quiz-navigation">
                <button class="btn btn-secondary" id="prevBtn">← Previous</button>
                <button class="btn btn-primary" id="nextBtn">Next →</button>
                <button class="btn btn-success" id="submitBtn" style="display: none;">Submit Quiz</button>
            </div>
        </main>
    </div>

    <!-- Result Page -->
    <div class="result-container" id="resultContainer" style="display: none;">
        <!-- Header -->
        <header class="result-header">
            <h1 class="result-title">Quiz Completed!</h1>
            <p class="result-subtitle">Grade: A - Excellent</p>
        </header>

        <!-- Main Content -->
        <main class="result-main">
            <!-- Congratulations -->
            <div class="congratulations">
                <h2 class="congrats-title">Congratulations! 🎉</h2>
            </div>

            <!-- Score Card -->
            <div class="score-card">
                <div class="score-display">
                    <span class="score-number" id="scoreNumber">0</span>
                    <span class="score-label" id="scoreLabel">out of 10</span>
                </div>
                <div class="percentage-display" id="percentageDisplay">0%</div>
            </div>

            <!-- Statistics Section -->
            <div class="stats-section">
                <div class="result-stats">
                    <div class="stat-item correct">
                        <div class="stat-item-label">Correct</div>
                        <div class="stat-item-value correct" id="correctCount">0</div>
                    </div>
                    <div class="stat-item incorrect">
                        <div class="stat-item-label">Incorrect</div>
                        <div class="stat-item-value incorrect" id="incorrectCount">0</div>
                    </div>
                    <div class="stat-item unanswered">
                        <div class="stat-item-label">Unanswered</div>
                        <div class="stat-item-value unanswered" id="unansweredCount">0</div>
                    </div>
                    <div class="stat-item time">
                        <div class="stat-item-label">Time Taken</div>
                        <div class="stat-item-value time" id="timeTakenDisplay">0:00</div>
                    </div>
                </div>
            </div>

            <!-- Answer Review Toggle -->
            <div class="review-toggle">
                <button class="btn btn-primary" id="toggleReviewBtn">View Answer Review</button>
            </div>

            <!-- Answer Review Section -->
            <div class="answer-review" id="answerReview">
                <h3 class="review-title">Answer Review</h3>
                <div class="review-list" id="reviewList">
                    <!-- Review items will be dynamically inserted here -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="result-buttons">
                <button class="btn btn-primary" id="retakeBtn">Retake Quiz</button>
                <button class="btn btn-secondary" id="homeBtn">Back to Home</button>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/questions.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
